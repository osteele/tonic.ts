sudo: false
language: node_js
node_js:
  - "18"

cache:
  directories:
    - ./node_modules

install:
  - curl -fsSL https://bun.sh/install | bash
  - export PATH="$HOME/.bun/bin:$PATH"
  - bun install --frozen-lockfile

script:
  - bun run lint
  - bun run check
  - bun run test
  - bun run docs

deploy:
  local-dir: docs/api
  provider: pages
  skip-cleanup: true
  github-token: $GITHUB_TOKEN
  on:
    branch: master

notifications:
  email:
    on_success: never
    on_failure: always
